<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Solar Flame Outer Gradient -->
    <linearGradient id="agniFlame" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="55%" stop-color="#f97316" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Core Sun Glow Radial -->
    <radialGradient id="sunCore" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#fb923c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- PCM Thermal Energy Ring Gradient -->
    <linearGradient id="pcmEnergy" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#ea580c" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Frame -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#f1f5f9" stroke-width="6" />
  
  <!-- Subtle Ambient Glow Behind Flame -->
  <circle cx="256" cy="270" r="140" fill="#fef08a" opacity="0.45" filter="url(#softGlow)" />

  <!-- PCM Thermal Storage Orbital Rings -->
  <path d="M 160 350 C 130 300 140 230 185 180" stroke="url(#pcmEnergy)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85" />
  <circle cx="160" cy="350" r="8" fill="#10b981" />
  
  <path d="M 352 350 C 382 300 372 230 327 180" stroke="url(#pcmEnergy)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85" />
  <circle cx="352" cy="350" r="8" fill="#10b981" />

  <!-- Dynamic Agni Solar Flame Droplet (Sacred Fire + Fluid Light Orb) -->
  <g filter="url(#ambientShadow)">
    <path d="M 256 96 
             C 275 160 340 230 340 300 
             C 340 365 295 408 256 408 
             C 217 408 172 365 172 300 
             C 172 230 237 160 256 96 Z" 
          fill="url(#agniFlame)" />
  </g>

  <!-- Inner Radiant Light Orb Droplet -->
  <path d="M 256 160 
           C 268 200 310 248 310 295 
           C 310 340 280 370 256 370 
           C 232 370 202 340 202 295 
           C 202 248 244 200 256 160 Z" 
        fill="url(#sunCore)" />

  <!-- Sacred Solar Spark / Thermal Core -->
  <circle cx="256" cy="300" r="28" fill="#ffffff" opacity="0.95" />
  <circle cx="256" cy="300" r="16" fill="#fef08a" />
</svg>
