<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <linearGradient id="flameMask" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="55%" stop-color="#f97316" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <radialGradient id="sunMask" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#fb923c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="pcmMask" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Full bleed for maskable safe area -->
  <rect width="512" height="512" fill="url(#bgMask)" />

  <!-- PCM Thermal Storage Orbital Rings within safe zone -->
  <path d="M 180 340 C 150 295 160 235 200 190" stroke="url(#pcmMask)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85" />
  <circle cx="180" cy="340" r="7" fill="#10b981" />
  
  <path d="M 332 340 C 362 295 352 235 312 190" stroke="url(#pcmMask)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85" />
  <circle cx="332" cy="340" r="7" fill="#10b981" />

  <!-- Agni Flame Droplet scaled into 80% safe center -->
  <path d="M 256 120 
           C 272 170 326 230 326 290 
           C 326 345 288 384 256 384 
           C 224 384 186 345 186 290 
           C 186 230 240 170 256 120 Z" 
        fill="url(#flameMask)" />

  <!-- Inner Radiant Light Orb Droplet -->
  <path d="M 256 170 
           C 266 205 300 245 300 286 
           C 300 325 276 352 256 352 
           C 236 352 212 325 212 286 
           C 212 245 246 205 256 170 Z" 
        fill="url(#sunMask)" />

  <!-- Central Thermal Spark -->
  <circle cx="256" cy="290" r="24" fill="#ffffff" opacity="0.95" />
  <circle cx="256" cy="290" r="14" fill="#fef08a" />
</svg>
